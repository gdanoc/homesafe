<!DOCTYPE html>
<html class="wide wow-animation" lang="es">
<head>
    <title>Página no encontrada - HomeSafe</title>
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width height=device-height initial-scale=1.0 maximum-scale=1.0 user-scalable=0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta charset="utf-8">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="//fonts.googleapis.com/css?family=Work+Sans:300,400,500,700,800%7CPoppins:300,400,700">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Work Sans', Arial, sans-serif;
            background: #000000;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #3498db;
            overflow-x: hidden;
            position: relative;
        }

        .error-container {
            text-align: center;
            max-width: 800px;
            padding: 2rem;
            animation: fadeInUp 0.8s ease-out;
            position: relative;
            z-index: 2;
            margin-top: 8rem;
        }

        .error-header {
            margin-bottom: 3rem;
        }

        .error-number {
            font-size: clamp(120px, 20vw, 300px);
            font-weight: 800;
            line-height: 0.8;
            background: linear-gradient(45deg, #3498db 0%, #5dade2 50%, #85c1e9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 50px rgba(52, 152, 219, 0.5);
            margin-bottom: 1rem;
            animation: float 3s ease-in-out infinite, glow 2s ease-in-out infinite alternate;
            position: relative;
        }

        .error-number::before {
            content: '404';
            position: absolute;
            top: 0;
            left: 0;
            background: linear-gradient(45deg, #1a1a1a, #333333);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            z-index: -1;
            transform: translate(3px, 3px);
            opacity: 0.3;
        }

        .error-title {
            font-size: clamp(24px, 4vw, 48px);
            font-weight: 600;
            color: #3498db;
            margin-bottom: 1rem;
            text-shadow: 0 2px 10px rgba(52, 152, 219, 0.3);
        }

        .error-message {
            font-size: clamp(16px, 2vw, 20px);
            color: #5dade2;
            line-height: 1.6;
            margin-bottom: 3rem;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            opacity: 0.9;
        }

        .error-actions {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .btn-primary {
            background: linear-gradient(45deg, #3498db, #5dade2);
            border: none;
            padding: 1rem 2.5rem;
            font-weight: 500;
            font-size: 1.1rem;
            border-radius: 12px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #000000;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
            position: relative;
            overflow: hidden;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: all 0.5s;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(52, 152, 219, 0.5);
            background: linear-gradient(45deg, #5dade2, #85c1e9);
            color: #000000;
            text-decoration: none;
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .btn-secondary {
            background: rgba(52, 152, 219, 0.1);
            border: 2px solid #3498db;
            padding: 0.875rem 2rem;
            font-weight: 500;
            font-size: 1rem;
            border-radius: 12px;
            transition: all 0.3s ease;
            color: #3498db;
            text-decoration: none;
            display: inline-block;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .btn-secondary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(52, 152, 219, 0.1), transparent);
            transition: all 0.5s;
        }

        .btn-secondary:hover {
            background: rgba(52, 152, 219, 0.2);
            border-color: #5dade2;
            transform: translateY(-2px);
            color: #5dade2;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.3);
        }

        .btn-secondary:hover::before {
            left: 100%;
        }

        .logo-container {
            position: absolute;
            top: 2rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            text-align: center;
            animation: fadeInDown 1s ease-out;
        }

        .logo {
            width: 200px;
            height: auto;
            opacity: 0.95;
            filter: brightness(1.2) drop-shadow(0 4px 8px rgba(52, 152, 219, 0.3));
            transition: all 0.3s ease;
        }

        .logo:hover {
            transform: scale(1.05);
            filter: brightness(1.3) drop-shadow(0 6px 12px rgba(52, 152, 219, 0.5));
        }

        .logo-text {
            font-family: 'Poppins', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(45deg, #3498db 0%, #5dade2 50%, #85c1e9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 2px 4px rgba(52, 152, 219, 0.3);
            margin-top: 0.5rem;
            letter-spacing: 2px;
            animation: logoGlow 3s ease-in-out infinite alternate;
        }

        .floating-shapes {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            animation: floatShapes 15s infinite linear;
        }

        .shape:nth-child(1) {
            width: 100px;
            height: 100px;
            top: 20%;
            left: 10%;
            background: rgba(52, 152, 219, 0.1);
            animation-delay: 0s;
        }

        .shape:nth-child(2) {
            width: 60px;
            height: 60px;
            top: 70%;
            left: 80%;
            background: rgba(52, 152, 219, 0.05);
            animation-delay: 5s;
        }

        .shape:nth-child(3) {
            width: 80px;
            height: 80px;
            top: 50%;
            left: 90%;
            background: rgba(52, 152, 219, 0.15);
            animation-delay: 10s;
        }

        .shape:nth-child(4) {
            width: 40px;
            height: 40px;
            top: 80%;
            left: 20%;
            background: rgba(52, 152, 219, 0.2);
            animation-delay: 7s;
        }

        .grid-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(52, 152, 219, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(52, 152, 219, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 0;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        @keyframes logoGlow {
            0% {
                text-shadow: 0 2px 4px rgba(52, 152, 219, 0.3);
            }
            100% {
                text-shadow: 0 2px 4px rgba(52, 152, 219, 0.3), 0 0 20px rgba(52, 152, 219, 0.6);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        @keyframes glow {
            0% {
                text-shadow: 0 0 20px rgba(52, 152, 219, 0.5);
            }
            100% {
                text-shadow: 0 0 30px rgba(52, 152, 219, 0.8), 0 0 40px rgba(52, 152, 219, 0.3);
            }
        }

        @keyframes floatShapes {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.7;
            }
            90% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .particle {
            position: absolute;
            background: #3498db;
            border-radius: 50%;
            animation: particle-float 8s infinite linear;
        }

        @keyframes particle-float {
            0% {
                transform: translateY(100vh) translateX(0px);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10px) translateX(100px);
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            .error-container {
                padding: 1rem;
            }

            .error-actions {
                flex-direction: column;
                width: 100%;
            }

            .btn-primary,
            .btn-secondary {
                width: 100%;
                max-width: 300px;
            }

            .logo-container {
                position: relative;
                top: 0;
                left: 0;
                transform: none;
                margin-bottom: 3rem;
                text-align: center;
            }

            .logo {
                width: 160px;
            }

            .logo-text {
                font-size: 2rem;
            }

            .error-container {
                margin-top: 0;
            }
        }

        @media (max-width: 480px) {
            .logo {
                width: 140px;
            }

            .logo-text {
                font-size: 1.8rem;
                letter-spacing: 1px;
            }
        }
    </style>
</head>

<body>
    <div class="grid-pattern"></div>

    <div class="particles" id="particles"></div>

    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <div class="logo-container">
        <img src="images/logo-light-115x34.png" alt="HomeSafe" class="logo" />
        <div class="logo-text">HomeSafe</div>
    </div>
    <div class="error-container">
        <div class="error-header">
            <div class="error-number">404</div>
            <h1 class="error-title">Página no encontrada</h1>
            <p class="error-message">
                Lo sentimos, la página que buscas no existe o ha sido movida. 
                Puede que hayas escrito mal la dirección o que la página ya no esté disponible.
            </p>
        </div>

    </div>

    <script>
        function createFloatingShape() {
            const shape = document.createElement('div');
            shape.className = 'shape';
            
            const size = Math.random() * 60 + 20; 
            shape.style.width = size + 'px';
            shape.style.height = size + 'px';
            shape.style.left = Math.random() * 100 + '%';
            shape.style.animationDuration = (Math.random() * 10 + 10) + 's'; 
            shape.style.animationDelay = Math.random() * 5 + 's';
            
            const blueShades = [
                'rgba(52, 152, 219, 0.1)',
                'rgba(52, 152, 219, 0.05)',
                'rgba(52, 152, 219, 0.15)',
                'rgba(52, 152, 219, 0.2)'
            ];
            shape.style.background = blueShades[Math.floor(Math.random() * blueShades.length)];
            
            document.querySelector('.floating-shapes').appendChild(shape);
            
            setTimeout(() => {
                if (shape.parentNode) {
                    shape.parentNode.removeChild(shape);
                }
            }, 25000);
        }

        setInterval(createFloatingShape, 3000);
        
        for(let i = 0; i < 3; i++) {
            setTimeout(createFloatingShape, i * 1000);
        }

        window.addEventListener('load', function() {
            const errorNumber = document.querySelector('.error-number');
            errorNumber.style.animation = 'float 3s ease-in-out infinite, fadeInUp 0.8s ease-out';
        });
    </script>
</body>
</html>
